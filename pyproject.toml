[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frontier-ops"
version = "0.4.0"
description = "Middleware for AI agent governance. Define boundaries. Monitor agents. Prove they stayed within bounds."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Joseph Hopkins" },
]
keywords = ["ai", "agents", "governance", "monitoring", "safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.24",
]

[project.scripts]
frontier-ops = "frontier_ops.integration.market_daemon:main"

[project.optional-dependencies]
kalman = ["scipy>=1.10"]
ica = ["scikit-learn>=1.2"]
governance = ["cryptography>=41.0"]
semantic = ["sentence-transformers>=2.2"]
# Product seams: detection (CalibratedDetector + boundary scorers) needs an
# encoder but no crypto; governance/authorization needs crypto but no encoder.
detect = ["sentence-transformers>=2.2"]
govern = ["cryptography>=41.0"]
all = [
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "cryptography>=41.0",
    "sentence-transformers>=2.2",
]
dev = [
    "pytest>=7.0",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "cryptography>=41.0",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/codechockablock/frontier-ops"
Documentation = "https://github.com/codechockablock/frontier-ops#readme"

[tool.hatch.build.targets.wheel]
packages = ["frontier_ops"]

[tool.mypy]
# No python_version pin: numpy>=2 ships stubs that need >=3.12 parsing;
# checking under the dev interpreter is fine for this lenient baseline.
files = ["frontier_ops"]
ignore_missing_imports = true
# Lenient starting point: real type errors fail, unannotated code passes.
check_untyped_defs = false
warn_unused_ignores = true

# Tracked typing baseline (2026-07-11): the only modules still excluded.
# - sensing.modes: quarantined dead weight (docs/LEGACY.md), DeprecationWarning
#   on import — not worth typing before removal.
# - integration detection_signals / signature_detectors / tiered_verdict:
#   ATBench glue with ~46 mechanical Optional/annotation debts; type when
#   next touched. Everything else in frontier_ops/ checks clean.
[[tool.mypy.overrides]]
module = [
    "frontier_ops.sensing.modes",
    "frontier_ops.integration.detection_signals",
    "frontier_ops.integration.signature_detectors",
    "frontier_ops.integration.tiered_verdict",
]
ignore_errors = true

[tool.ruff]
# Verbatim provenance records from live sessions — never reformat or lint.
extend-exclude = ["eval/session_artifacts"]

[tool.ruff.lint.per-file-ignores]
# Eval scripts are intentionally terse (compound statements, inline
# experiment state); lint them for real errors only, not style.
"eval/**" = ["E401", "E402", "E701", "E702", "E741", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running eval battery checks (need Apollo data + sentence-transformers)",
]
