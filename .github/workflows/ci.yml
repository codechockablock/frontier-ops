name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_battery:
        description: "Run the slow eval battery (fetches Apollo data)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short -m "not slow and not perf"

    - name: Check import cleanliness
      run: |
        python -c "from frontier_ops import FullPipeline, CalibratedDetector, RollingThreshold; print('Import OK')"
        python -c "from frontier_ops.sensing import DASCUSUM, MarketGate; print('Sensing OK')"
        python -c "from frontier_ops.governance import GovernanceChain, MarketAuditChain; print('Governance OK')"
        python -c "from frontier_ops.authorization import GoalExtractor, AuthorizationRadius; print('Authorization OK')"

  # The package must import with numpy alone — every heavier dependency
  # (scipy, cryptography, sentence-transformers) sits behind a lazy guard.
  numpy-only-import:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install with core dependencies only
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Import with numpy only
      run: python -c "import frontier_ops; print('numpy-only import OK')"

  # Semantic lane: sentence-transformers installed, so the Tier-2 /
  # CalibratedDetector / semantic-extraction tests actually run instead of
  # silently skipping (they skip in the plain [dev] matrix).
  semantic:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Cache sentence-transformers model
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: hf-all-MiniLM-L6-v2-${{ runner.os }}

    - name: Install dependencies (all extras)
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all]" pytest

    - name: Run full suite with semantic paths active
      run: |
        python -m pytest tests/ -v --tb=short -m "not slow and not perf"

    - name: Assert detector tests did not skip
      run: |
        set -o pipefail
        python -m pytest tests/test_detector.py tests/boundary/test_semantic_extraction.py -q -m "not slow" -rs | tee /tmp/detector-lane.out
        ! grep -q "SKIPPED" /tmp/detector-lane.out

  # Slow eval battery: manual trigger only (downloads Apollo data).
  battery:
    if: github.event_name == 'workflow_dispatch' && inputs.run_battery
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Cache sentence-transformers model
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: hf-all-MiniLM-L6-v2-${{ runner.os }}

    - name: Install dependencies (all extras)
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all]" pytest

    - name: Fetch Apollo data
      run: python -m eval.battery --fetch-only

    - name: Run slow battery tests
      run: python -m pytest tests/ -v --tb=short -m "slow"

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: pip install ruff

    - name: Lint
      run: ruff check frontier_ops/ tests/ --select E,F,W --ignore E501

    - name: Type check (non-blocking)
      continue-on-error: true
      run: |
        pip install -e ".[dev]"
        mypy frontier_ops/
