name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short
    
    - name: Check import cleanliness
      run: |
        python -c "from frontier_ops import FullPipeline; print('Import OK')"
        python -c "from frontier_ops.sensing import DASCUSUM, MarketGate; print('Sensing OK')"
        python -c "from frontier_ops.governance import GovernanceChain, MarketAuditChain; print('Governance OK')"
        python -c "from frontier_ops.authorization import GoalExtractor, AuthorizationRadius; print('Authorization OK')"

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install dependencies
      run: pip install ruff
    
    - name: Lint
      run: ruff check frontier_ops/ --select E,F,W --ignore E501
